name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Verify Lean license headers
        run: |
          missing=0
          while IFS= read -r file; do
            if ! sed -n '1p' "${file}" | grep -Fxq '/-' ||
               ! sed -n '2p' "${file}" | grep -Eq '^Copyright \(c\) [0-9]{4} Steven Sabean\. All rights reserved\.$' ||
               ! sed -n '3p' "${file}" | grep -Fxq 'Released under MIT license as described in the file LICENSE.' ||
               ! sed -n '4p' "${file}" | grep -Eq '^Authors: .+' ||
               ! sed -n '5p' "${file}" | grep -Fxq '-/'; then
              echo "Missing or malformed license header: ${file}"
              missing=1
            fi
          done < <(find . -type f -name '*.lean' -not -path './.lake/*' -not -path './.git/*' | sort)
          exit "${missing}"

      - name: Reject unfinished proofs
        run: |
          if grep -RInE --include='*.lean' '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' RiemannRoch RiemannRoch.lean; then
            echo "Lean proof placeholders are not permitted."
            exit 1
          fi

      - name: Verify public module coverage
        run: |
          missing=0
          while IFS= read -r file; do
            module="${file%.lean}"
            module="${module//\//.}"
            if ! grep -Fxq "import ${module}" RiemannRoch.lean; then
              echo "Missing from RiemannRoch.lean: ${module}"
              missing=1
            fi
          done < <(find RiemannRoch -type f -name '*.lean' | sort)
          exit "${missing}"

      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          auto-config: false
          build: true

      - name: Check public API smoke test
        run: lake env lean test/PublicAPI.lean

      - name: Lint declarations
        run: lake lint
